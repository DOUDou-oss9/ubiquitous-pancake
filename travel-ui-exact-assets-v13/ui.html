<!doctype html><meta charset="utf-8"><style>body{font:14px system-ui;padding:20px;color:#272018;background:#faf7f0}button{padding:12px 20px;border:0;border-radius:20px;background:#19150e;color:white;cursor:pointer}p{line-height:1.6;color:#776f61}</style><h2>Travel UI · Exact Assets</h2><p>生成 13 个可编辑页面，使用你上传的原图，并建立页面之间的 Prototype 跳转。</p><button id="run">生成 13 个页面</button><p id="status">准备就绪</p><script>const b=document.getElementById('run'),s=document.getElementById('status');b.onclick=()=>{b.disabled=true;s.textContent='正在生成…';parent.postMessage({pluginMessage:{type:'run'}},'*')};onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;b.disabled=false;s.textContent=m.type==='done'?'已生成 '+m.screens+' 个页面和 '+m.links+' 个交互入口。':'生成失败：'+m.message}</script>
